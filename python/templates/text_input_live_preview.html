{% extends "base.html" %}

{% block title %}Text input live preview{% endblock %}

{% block stylesheets %}
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
{% endblock %}

{% block content %}
<h2>Text input live preview</h2>
<div class="column-wrapper">
    <div class="column">
        <h3>Input:</h3>
        <textarea id="text-input-textarea">
Markdown: **bold**, *italic*, `inline code`, [link](www.google.com), etc.

Inline latex: $f(x) = 4x^2$

Block latex:
$$
\sum_{i=1}^{n} i = \frac{n(n+1)}{2}
$$</textarea>
    </div>
    <div class="column">
        <h3>Preview:</h3>
        <div id="text-input-preview"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <script src="/static/js/text-input-live-preview.js"></script>
{% endblock %}
